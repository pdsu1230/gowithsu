<!DOCTYPE html>
<html class="light" lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Sư | Lịch Sử Tour</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-primary-fixed": "#092100",
            "background": "#f8f9fa",
            "surface-container-lowest": "#ffffff",
            "surface-container": "#edeeef",
            "primary-container": "#2a4d14",
            "on-tertiary-fixed": "#2a1800",
            "surface-bright": "#f8f9fa",
            "on-primary": "#ffffff",
            "tertiary-container": "#5a401d",
            "outline": "#73796c",
            "on-secondary-container": "#4e6874",
            "surface-container-highest": "#e1e3e4",
            "primary": "#143600",
            "error": "#ba1a1a",
            "on-tertiary-fixed-variant": "#5c421f",
            "on-background": "#191c1d",
            "secondary-fixed": "#cbe7f5",
            "secondary-container": "#cbe7f5",
            "on-primary-fixed-variant": "#2c4f16",
            "tertiary-fixed": "#ffddb6",
            "secondary": "#48626e",
            "surface": "#f8f9fa",
            "surface-container-high": "#e7e8e9",
            "on-secondary": "#ffffff",
            "on-tertiary-container": "#d1ac80",
            "primary-fixed-dim": "#a8d38a",
            "secondary-fixed-dim": "#afcbd8",
            "surface-container-low": "#f3f4f5",
            "on-secondary-fixed": "#021f29",
            "inverse-surface": "#2e3132",
            "outline-variant": "#c3c9b9",
            "on-surface-variant": "#43493d",
            "on-error-container": "#93000a",
            "error-container": "#ffdad6",
            "on-surface": "#191c1d",
            "inverse-on-surface": "#f0f1f2",
            "surface-variant": "#e1e3e4",
            "on-tertiary": "#ffffff",
            "inverse-primary": "#a8d38a",
            "tertiary": "#412a09",
            "surface-dim": "#d9dadb",
            "primary-fixed": "#c4efa4",
            "on-secondary-fixed-variant": "#304a55",
            "on-error": "#ffffff"
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Be Vietnam Pro', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-background text-on-background selection:bg-primary-fixed selection:text-primary overflow-x-hidden">

  <!-- Sidebar -->
  <div id="admin-sidebar-mount"></div>

  <!-- Main -->
  <main class="ml-64 min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-40 flex w-full items-center justify-between bg-slate-50/80 px-8 py-4 font-['Be_Vietnam_Pro'] tracking-tight shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)] backdrop-blur-xl antialiased">
      <div class="flex items-center gap-4">
        <h2 class="text-lg font-bold tracking-tighter text-[#143600]">Lịch sử chuyến đi</h2>
        <span class="rounded-full bg-surface-container-high px-3 py-1 text-xs font-bold uppercase tracking-wider text-on-secondary-container">Đã hoàn thành</span>
      </div>
      <div class="flex items-center gap-3">
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">search</span>
          <input id="history-search" class="w-64 rounded-full border-none bg-white py-2 pl-10 pr-4 text-sm transition-all focus:ring-2 focus:ring-primary/10" placeholder="Tìm tên tour..." type="text" />
        </div>
      </div>
    </header>

    <!-- Content -->
    <div class="px-8 py-8 space-y-8">
      <!-- Stats bar -->
      <div id="history-stats" class="mb-8 grid grid-cols-3 gap-4"></div>

      <!-- Tour list -->
      <div id="history-list" class="space-y-4">
        <div class="flex items-center justify-center py-20 text-slate-400">
          <span class="material-symbols-outlined animate-spin mr-2">autorenew</span>
          Đang tải...
        </div>
      </div>
    </div>

    <div id="admin-footer-mount"></div>
  </main>

  <script src="/admin-shared-layout.js"></script>
  <script src="/admin-history.js?v=20260504-1"></script>
</body>
</html>
