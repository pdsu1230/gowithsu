<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>GoWithSu | Tất Cả Hành Trình</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link href="/mobile-search.css" rel="stylesheet" />
  <link href="/mobile-go.css" rel="stylesheet" />
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .tour-card-description {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @media (max-width: 767px) {
      #mobile-filter-bar {
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.2rem);
      }
    }
  </style>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "primary-fixed": "#c4efa4",
            "on-surface": "#191c1d",
            "surface-container-high": "#e7e8e9",
            "on-tertiary-container": "#d1ac80",
            "background": "#f8f9fa",
            "surface-container-low": "#f3f4f5",
            "outline-variant": "#c3c9b9",
            "on-background": "#191c1d",
            "on-error-container": "#93000a",
            "primary": "#143600",
            "surface-container": "#edeeef",
            "on-primary-container": "#94be78",
            "surface-bright": "#f8f9fa",
            "on-primary": "#ffffff",
            "on-primary-fixed": "#052100",
            "primary-fixed-dim": "#94be78",
            "on-primary-fixed-variant": "#204f00",
            "inverse-primary": "#94be78",
            "secondary": "#4e6874",
            "on-secondary": "#ffffff",
            "secondary-container": "#d1ecf9",
            "on-secondary-container": "#4e6874",
            "tertiary": "#745b00",
            "tertiary-container": "#f3c800",
            "on-tertiary-container": "#574400",
            "surface": "#f8f9fa",
            "surface-container-lowest": "#ffffff",
            "on-surface-variant": "#424b40",
            "outline": "#717d6e",
            "primary-container": "#b5d99c",
            "on-primary-container": "#052100"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
          "fontFamily": {
            "headline": ["Be Vietnam Pro"],
            "body": ["Be Vietnam Pro"],
            "label": ["Be Vietnam Pro"]
          }
        }
      }
    }
  </script>
</head>

<body class="bg-background text-on-surface">

  <!-- Navbar -->
  <div id="shared-navbar-mount"></div>
  <div id="shared-mobile-search-mount"></div>

  <main class="pt-24 md:pt-28 pb-28 md:pb-24 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 md:px-8">
      <!-- Header -->
      <div class="mb-7 rounded-[28px] border border-emerald-100 bg-[radial-gradient(circle_at_top_left,_rgba(196,239,164,0.35),_rgba(255,255,255,0.92)_45%),linear-gradient(180deg,_rgba(255,255,255,0.98),_rgba(247,249,246,0.95))] px-4 py-5 shadow-[0_18px_40px_-30px_rgba(20,54,0,0.28)] md:mb-12 md:px-8 md:py-8">
        <a class="mb-5 inline-flex items-center gap-1.5 text-sm text-slate-500 transition-colors hover:text-primary"
          href="/">
          <span class="material-symbols-outlined text-base">arrow_back</span>
          Trang chủ
        </a>
        <span class="mb-3 block text-[11px] font-bold uppercase tracking-[0.22em] text-primary/80">All Expeditions</span>
        <h1 class="text-3xl font-black tracking-tighter text-on-surface md:text-4xl">Tất Cả Hành Trình</h1>
        <p class="mt-3 max-w-2xl text-sm leading-6 text-slate-600 md:text-base">Chọn nhanh theo loại hành trình và lướt qua những tour phù hợp nhất với phong cách di chuyển của bạn.</p>
      </div>

      <!-- Filter bar -->
      <div class="mb-6 hidden gap-2.5 md:mb-10 md:flex md:gap-3" id="filter-bar">
        <button
          class="filter-btn active rounded-full border-2 border-primary bg-primary px-4 py-2 text-sm font-semibold text-on-primary transition-all"
          data-filter="all">Tất cả</button>
      </div>

      <!-- Tour grid -->
      <div id="tour-list" class="grid grid-cols-1 md:grid-cols-3 gap-5 md:gap-8"></div>

      <!-- Empty state -->
      <div id="tours-empty" class="hidden py-24 text-center text-slate-400">
        <span class="material-symbols-outlined text-6xl mb-4 block">hiking</span>
        <p class="text-lg font-semibold">Không có tour nào phù hợp.</p>
      </div>
    </div>
  </main>

  <div id="mobile-filter-bar" class="fixed inset-x-0 bottom-0 z-40 border-t border-slate-200/80 bg-white/95 px-2 py-2 shadow-[0_-18px_40px_-30px_rgba(15,23,42,0.45)] backdrop-blur md:hidden">
    <div class="mx-auto grid max-w-7xl grid-cols-5 gap-1">
      <button class="mobile-filter-btn flex flex-col items-center gap-1 rounded-2xl px-1 py-1.5 text-[11px] font-semibold text-slate-500 transition-all" data-filter="all" type="button">
        <span class="mobile-filter-icon material-symbols-outlined inline-flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-[20px] text-slate-500">grid_view</span>
        <span class="mobile-filter-label leading-none">Tất cả</span>
      </button>
      <button class="mobile-filter-btn flex flex-col items-center gap-1 rounded-2xl px-1 py-1.5 text-[11px] font-semibold text-slate-500 transition-all" data-filter="TREKKING" type="button">
        <span class="mobile-filter-icon material-symbols-outlined inline-flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-[20px] text-slate-500">terrain</span>
        <span class="mobile-filter-label leading-none">Trekking</span>
      </button>
      <button class="mobile-filter-btn flex flex-col items-center gap-1 rounded-2xl px-1 py-1.5 text-[11px] font-semibold text-slate-500 transition-all" data-filter="HIKING" type="button">
        <span class="mobile-filter-icon material-symbols-outlined inline-flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-[20px] text-slate-500">hiking</span>
        <span class="mobile-filter-label leading-none">Hiking</span>
      </button>
      <button class="mobile-filter-btn flex flex-col items-center gap-1 rounded-2xl px-1 py-1.5 text-[11px] font-semibold text-slate-500 transition-all" data-filter="BIỂN" type="button">
        <span class="mobile-filter-icon material-symbols-outlined inline-flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-[20px] text-slate-500">beach_access</span>
        <span class="mobile-filter-label leading-none">Biển</span>
      </button>
      <button class="mobile-filter-btn flex flex-col items-center gap-1 rounded-2xl px-1 py-1.5 text-[11px] font-semibold text-slate-500 transition-all" data-filter="ROAD" type="button">
        <span class="mobile-filter-icon material-symbols-outlined inline-flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-[20px] text-slate-500">route</span>
        <span class="mobile-filter-label leading-none">Road</span>
      </button>
    </div>
  </div>

  <!-- Footer -->
  <div id="shared-footer-mount"></div>

  <div id="shared-admin-dialog-mount"></div>

  <script src="/shared-layout.js"></script>
  <script src="/tours.js?v=20260425-1"></script>
  <script src="/mobile-nav.js"></script>
  <script src="/nav-search.js"></script>
</body>

</html>
