<!DOCTYPE html>
<html class="light" lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Sử | Tổng Quan</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-primary-fixed": "#092100",
            "background": "#f8f9fa",
            "surface-container-lowest": "#ffffff",
            "surface-container": "#edeeef",
            "primary-container": "#2a4d14",
            "on-tertiary-fixed": "#2a1800",
            "surface-bright": "#f8f9fa",
            "on-primary": "#ffffff",
            "tertiary-container": "#5a401d",
            "outline": "#73796c",
            "on-secondary-container": "#4e6874",
            "surface-container-highest": "#e1e3e4",
            "primary": "#143600",
            "error": "#ba1a1a",
            "on-background": "#191c1d",
            "secondary-fixed": "#cbe7f5",
            "secondary-container": "#cbe7f5",
            "secondary": "#48626e",
            "surface": "#f8f9fa",
            "surface-container-high": "#e7e8e9",
            "on-secondary": "#ffffff",
            "primary-fixed-dim": "#a8d38a",
            "surface-container-low": "#f3f4f5",
            "on-secondary-fixed": "#021f29",
            "inverse-surface": "#2e3132",
            "outline-variant": "#c3c9b9",
            "on-surface-variant": "#43493d",
            "on-error-container": "#93000a",
            "error-container": "#ffdad6",
            "on-surface": "#191c1d",
            "inverse-on-surface": "#f0f1f2",
            "on-error": "#ffffff",
            "primary-fixed": "#c4efa4",
            "tertiary": "#412a09",
            "surface-dim": "#d9dadb",
            "inverse-primary": "#a8d38a"
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Be Vietnam Pro', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>
<body class="bg-background text-on-background selection:bg-primary-fixed selection:text-primary overflow-x-hidden">

  <!-- Sidebar -->
  <div id="admin-sidebar-mount"></div>

  <!-- Main -->
  <main class="ml-64 min-h-screen">
    <header class="sticky top-0 z-40 flex w-full items-center justify-between bg-slate-50/80 px-8 py-4 font-['Be_Vietnam_Pro'] tracking-tight shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)] backdrop-blur-xl antialiased">
      <div class="flex items-center gap-4">
        <h2 class="text-lg font-bold tracking-tighter text-[#143600]">Tổng quan</h2>
        <span class="rounded-full bg-surface-container-high px-3 py-1 text-xs font-bold uppercase tracking-wider text-on-secondary-container">Dashboard</span>
      </div>
      <!--<div class="flex items-center gap-4 text-slate-500">
        <button class="transition-colors hover:text-primary" type="button"><span class="material-symbols-outlined">notifications</span></button>
        <button class="transition-colors hover:text-primary" type="button"><span class="material-symbols-outlined">settings</span></button>
        <div class="flex h-9 w-9 items-center justify-center rounded-full border-2 border-emerald-100 bg-primary text-xs font-black text-white">AD</div>
      </div>-->
    </header>

    <div class="px-8 py-8 space-y-8">

      <!-- Stat cards -->
      <div class="grid grid-cols-2 gap-6">
        <div class="flex items-center gap-5 rounded-2xl bg-white px-7 py-6 shadow-sm">
          <div class="flex h-14 w-14 flex-shrink-0 items-center justify-center rounded-2xl bg-primary-fixed">
            <span class="material-symbols-outlined text-2xl text-primary" style="font-variation-settings:'FILL' 1">landscape</span>
          </div>
          <div>
            <p id="stat-total-tours" class="text-3xl font-black text-primary">—</p>
            <p class="text-xs font-bold uppercase tracking-widest text-slate-400 mt-0.5">Tổng tour đã thực hiện</p>
          </div>
        </div>
        <div class="flex items-center gap-5 rounded-2xl bg-white px-7 py-6 shadow-sm">
          <div class="flex h-14 w-14 flex-shrink-0 items-center justify-center rounded-2xl bg-primary-fixed">
            <span class="material-symbols-outlined text-2xl text-primary" style="font-variation-settings:'FILL' 1">group</span>
          </div>
          <div>
            <p id="stat-total-guests" class="text-3xl font-black text-primary">—</p>
            <p class="text-xs font-bold uppercase tracking-widest text-slate-400 mt-0.5">Tổng khách đã tham gia</p>
          </div>
        </div>
      </div>

      <!-- Chart -->
      <div class="rounded-2xl bg-white px-7 py-7 shadow-sm">
        <div class="mb-5 flex items-center justify-between">
          <div>
            <p class="text-base font-extrabold tracking-tight text-primary">Khách tham gia theo tháng</p>
            <p class="text-xs text-slate-400 mt-0.5">Số lượng thành viên đã tham gia và sắp tham gia tour theo từng tháng</p>
          </div>
        </div>
        <div class="relative h-72">
          <canvas id="guests-chart"></canvas>
        </div>
      </div>

    </div>

    <div id="admin-footer-mount"></div>
  </main>

  <script src="/admin-shared-layout.js"></script>
  <script src="/admin-overview.js?v=20260503-2"></script>
</body>
</html>
